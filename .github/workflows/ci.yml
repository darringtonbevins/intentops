# The ordinary build: does the code import, and do the tests pass.
#
# This is deliberately the SMALLEST of the four workflows. It answers "is the
# tree healthy", and it answers nothing about whether the tree is safe to
# publish -- that is exposure-gate.yml -- or whether the gate can actually
# refuse -- that is contract-tests.yml. Keeping them separate means a red build
# says which question failed.
#
# Every step here fails loudly. There is no `continue-on-error` and no `|| true`
# anywhere in this file, on purpose: a step that is allowed to fail quietly is
# a step nobody reads the output of.

name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor the project declares. 3.12 is here so that a
        # version-specific break is caught by CI rather than by the first
        # stranger who clones this on a newer interpreter.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the core package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Install the reference saddle
        # --no-deps because its one real dependency is the core, which was just
        # installed from this tree as editable. Letting the resolver reach out
        # for a published `intentops` would test a package we did not build.
        run: pip install -e packages/intentops-saddle-claudecode --no-deps

      - name: Prove the gate imports without a host
        # The core must stand up on its own. If this step needs a saddle to
        # import, the package split has already been broken and every later
        # green result is measuring something else.
        run: python -c "import intentops_core.gate as g; print(sorted(g.__all__))"

      - name: Run the test suite
        run: pytest -q

      - name: Prove the selftest registry can report a planted failure
        # Ask the counter to fail on purpose before believing the count it
        # produces in the next step. A detector that has never fired is
        # indistinguishable from a broken one -- including this one.
        run: python -m intentops_core.selftests.registry --selftest

      - name: Run EVERY instrument selftest
        # This step used to be ten module names, typed by hand. A hand list
        # goes stale in the direction that looks green: an eleventh
        # instrument is born and nothing runs it, and nothing says so. The
        # registry DERIVES the population from the tree instead -- every
        # module owning a selftest() callable and every script advertising
        # --selftest -- runs each in a subprocess with a timeout and stdin
        # closed, and keeps an instrument that CANNOT run in the denominator
        # as ERROR rather than dropping it.
        #
        # It exits non-zero on any FAIL, ERROR, TIMEOUT, or discovery
        # finding, so this step is red for all four and the log says which.
        run: python -m intentops_core.selftests.registry

      - name: Check the generated store schema has not drifted
        # deploy/schema/genesis.sql is a GENERATED projection of schema.py. A
        # hand edit there is a store whose declared write model and whose
        # actual DDL disagree -- caught here rather than in a database.
        run: python -m intentops_core.cli substrate init --check

      - name: Re-hash the imprint against its manifest
        # The bundle's bytes are checked on every push, not only at a node's
        # birth. A drift here means the published imprint is not the imprint
        # the manifest claims -- which is exactly the class this instrument
        # exists to catch, and CI is the earliest place to catch it.
        run: python -m intentops_core.genesis.integrity --no-record
