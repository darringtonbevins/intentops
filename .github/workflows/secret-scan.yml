# Key material must never reach this repository.
#
# This workflow is narrow on purpose. It asks ONE question -- is there anything
# in this tree shaped like a private key, a token, or a credential -- and the
# answer is zero-tolerance. There is no allowlist, no threshold, and nothing
# here is advisory.
#
# It is separate from exposure-gate.yml because the two failures are different
# in kind and want different reactions. An exposure hit is a name that has to be
# scrubbed. A secret hit is a credential that has to be ROTATED, and scrubbing
# it from the tree does not undo that -- the moment it was pushed, it was
# disclosed. Merging the two workflows would blur a cleanup into an incident.

name: secret-scan

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trust-material:
    name: no key material in the tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the reader
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: The scanner must exist
        # A missing scanner is not a clean tree. Without this step the next one
        # would fail with an interpreter error about a path, which reads like a
        # broken workflow rather than an absent control -- and an absent control
        # that looks like a glitch is the one nobody re-arms.
        run: |
          if [ ! -f scripts/ops/trust_material_check.py ]; then
            echo "::error::scripts/ops/trust_material_check.py is MISSING."
            echo "This job exists to prove no key material is in the tree."
            echo "With the scanner absent it proves nothing, so it fails rather"
            echo "than reporting a clean scan it did not perform."
            exit 1
          fi

      - name: The scanner must be able to fire
        # The planted-fixture run. A scanner that has never been seen to go red
        # is indistinguishable from one that cannot, so it is made to find a
        # deliberately planted sample before its verdict on the real tree is
        # given any weight. The fixture is synthetic and never a real key.
        run: python scripts/ops/trust_material_check.py --selftest

      - name: Scan the tree
        run: python scripts/ops/trust_material_check.py

      - name: What a green result here does not mean
        # Printed on success so the claim travels with the badge. A control that
        # publishes no sensitivity invites its result to be read as more than it
        # is, and this one has a large and easily forgotten blind spot.
        if: success()
        run: |
          echo "Clean over the WORKING TREE only, for the shapes this scanner"
          echo "declares. It reads no git history: a credential removed from"
          echo "the tree today may still sit in an earlier commit, and this"
          echo "job would report clean either way. It is also not a statement"
          echo "about any credential shape the scanner does not declare."
