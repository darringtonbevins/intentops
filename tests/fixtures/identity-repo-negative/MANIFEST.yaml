# FICTIONAL, and deliberately NON-CONFORMANT. See README.md for the list.
schema: identity-repo/v1
contract_version: "1.0"
as_of: "2026-09-06"

intentops:
  requires: ">=0.1,<0.2"
  pinned: "0.1.0"
  release_root_fingerprint: "sha256:PLACEHOLDER-RELEASE-ROOT"
  validated_at: "2026-09-06"

identity:
  designation: "node-9a8b7c6d"
  # VIOLATION 3 (NAME-UNRATIFIED): a name, with nobody named as ratifying it.
  name: "a name it gave itself"

operator:
  root_fingerprint: "sha256:PLACEHOLDER-OPERATOR-ROOT"

bound_node: "node-9a8b7c6d"

binding:
  precedence: ["environment", "genesis-argument", "node-config"]
  # VIOLATION 2 (BINDING): there is no default. A node with nothing bound
  # halts and says what it needs.
  default: "./identity"

lineage: []

falsifier:
  # VIOLATION 1 (MANIFEST-FALSIFIER): blank. A belief carrier that states no
  # falsifier is carried past the day it stopped being true with nobody asking.
  reopens_when: ""

# VIOLATION 6 (FOREIGN-GRANT): granted by a root that is not this
# repository's operator. A grant whose granting fingerprint is not this node's
# operator root raises nothing.
grants:
  - id: "GRANT-FICTIONAL-01"
    granted_by: "sha256:PLACEHOLDER-SOME-OTHER-ROOT"
    scope: "delegated autonomy over this node"
    expires_at: "2027-01-01"

members:
  - path: "identity/identity.yaml"
    write_model: locked-whole-file
    validator: "scripts/identity/identity_repo_check.py"
  - path: "identity/consent.yaml"
    write_model: locked-whole-file
    validator: "scripts/identity/identity_repo_check.py"
  - path: "identity/epochs.yaml"
    write_model: locked-whole-file
    validator: "scripts/identity/identity_repo_check.py"
  # VIOLATION 4 (MEMBER-WRITE-MODEL): not in the closed vocabulary.
  - path: "identity/operator/operator.yaml"
    write_model: "however it happens"
    validator: "scripts/identity/identity_repo_check.py"
  - path: "wisdom/orderings.jsonl"
    write_model: append-only-journal
    validator: "intentops_core.wisdom.ordering"
  - path: "wishes/REGISTER.yaml"
    write_model: locked-whole-file
    validator: "scripts/wish_register_check.py"
  - path: "twin"
    write_model: per-item-files
    validator: "scripts/identity/identity_repo_check.py"
  - path: "continuity/memory"
    write_model: per-item-files
    validator: "scripts/identity/identity_repo_check.py"
  - path: "conscience/core-review/ledger.jsonl"
    write_model: append-only-journal
    validator: "intentops_core.governance.values_council"
  - path: "conscience/loto/LEDGER.yaml"
    write_model: locked-whole-file
    validator: "scripts/ops/loto_check.py"
  # VIOLATION 5 (MEMBER-MISSING): declared here, absent from disk.
  - path: "conscience/people/ledger.jsonl"
    write_model: append-only-journal
    validator: "scripts/identity/identity_repo_check.py"
  - path: "estate/estate-map.yaml"
    write_model: locked-whole-file
    validator: "scripts/estate/estate_manifest_check.py"
  - path: "intelligence"
    write_model: per-item-files
    validator: "scripts/identity/identity_repo_check.py"
  - path: "knowledge/MANIFEST.yaml"
    write_model: pointer-only
    validator: "scripts/identity/identity_repo_check.py"
  - path: "trust"
    write_model: generated-projection
    validator: "scripts/ops/trust_material_check.py"
  - path: ".gitignore"
    write_model: locked-whole-file
    validator: "scripts/ops/trust_material_check.py"
