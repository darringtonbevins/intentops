# DEPENDENCIES -- what must be alive for a capability to work.
#
# GENESIS SHIPS THE OPERATOR'S HALF OF THIS EMPTY. A MISSING file is a HALT
# (estate/README.md).
#
# THREE ENTRIES ARE NOT EMPTY, AND THE REASON IS STATED RATHER THAN ASSUMED.
# The framework's own genesis service graph (deploy/docker-compose.genesis.yml)
# is a dependency of the framework, not of anybody's estate: a node cannot
# instantiate the stores that are not files without a database running. Those
# three entries are declared here at birth, carry no estate identity of any
# kind -- generic images, registered loopback ports, no account, no host, no
# credential -- and are the same on every clone. Everything the OPERATOR adds
# still starts empty, and this is the same shape as CAPABILITIES.yaml, which
# ships the nine framework-declared kinds beside an empty capability list.
# Precedent for the shape, not an excuse for widening it: an entry that names
# a particular deployment does not belong here.
#
# WRITE MODEL: single writer -- the operator, by hand or through an explicit
# generator, one process at a time. The loader never writes this file.
#
# CLOSED VOCABULARIES. An undeclared value is a HALT:
#
#   kind:        service | package | host | credential | external-api
#   criticality: required | degraded-ok | optional
#
# `health_probe` HAS NO DEFAULT, AND A REFUSAL STAYS IN THE DENOMINATOR.
#
#   - the key MISSING is a HALT. A dependency whose health nobody described is
#     a field nobody read.
#   - the key present and NULL means "this dependency cannot be probed". That
#     is a legitimate state and it must be SAID, not implied: the entry must
#     also carry `unprobeable_reason`, and the loader then materialises the
#     probe as `{"type": "unprobeable", "reason": "<that text>"}`.
#   - `health_probe: null` with NO `unprobeable_reason` is a HALT.
#
#   The reason this shape exists rather than "skip the ones we cannot check":
#   an entry that leaves the population makes every coverage number LOOK
#   BETTER. A silent failure leaves a suspicious zero; a denominator failure
#   leaves a flattering number, which is why it survives review. An
#   unprobeable dependency is counted, graded not-ok, and carries WHY.
#
# REQUIRED PER ENTRY: id, kind, depends_on, health_probe, criticality,
#                     fallback, as_of
#
#   depends_on -- ids of capabilities or other dependencies. May be []
#   fallback   -- what happens when this is down. "none" is an answer; absence
#                 of the field is not
#
# EXAMPLE ENTRIES (commented out; the names are fictional):
#
# - id: "dep-local-runtime"
#   kind: service
#   depends_on: []
#   health_probe: "GET http://127.0.0.1:11434/api/tags returns 200"
#   criticality: degraded-ok
#   fallback: "the node runs with no local inference and says so"
#   as_of: "2026-09-06"
#
# - id: "dep-operator-attention"
#   kind: host
#   depends_on: []
#   health_probe: null
#   unprobeable_reason: "whether a human is at the keyboard is not mechanically decidable from here; the TTY check at a gate is the closest instrument and it answers a narrower question"
#   criticality: required
#   fallback: "human-gated work waits; it never proceeds on a default"
#   as_of: "2026-09-06"

schema: estate-dependencies/v1
as_of: "2026-09-06"
entries:

  # Every health_probe below is a REAL, runnable check and never null: these
  # three are the one class of dependency that IS mechanically probeable, so
  # `unprobeable` here would be a refusal we did not have to make.
  - id: "dep-genesis-postgres"
    kind: service
    depends_on: []
    health_probe: "pg_isready against the registered vector_store port on 127.0.0.1 exits 0, AND `SELECT count(*) FROM schema_migrations` returns at least one row -- a server that is up with no schema applied is a different finding from a server that is down, and both are failures"
    criticality: required
    fallback: "none. The stores that are not files have nowhere to live, so genesis HALTs at G3 and says which service is absent; it never proceeds with a subset of its organs and calls that born"
    as_of: "2026-09-06"

  - id: "dep-genesis-cache"
    kind: service
    depends_on: []
    health_probe: "valkey-cli PING against the registered cache port on 127.0.0.1 answers PONG"
    criticality: degraded-ok
    fallback: "the node runs single-process: loop coordination and short-lived cache fall back to in-process state, and the come-online report SAYS the node is degraded rather than reporting a smaller healthy graph"
    as_of: "2026-09-06"

  - id: "dep-genesis-local-inference"
    kind: service
    depends_on: []
    health_probe: "GET /api/tags on the registered local_inference port on 127.0.0.1 returns 200 -- and the model list is read, because a server answering with no model loaded cannot serve a generation and should not read as healthy"
    criticality: optional
    fallback: "the node uses whatever remote provider its operator has configured; with none, it states plainly that it has no generation rung rather than degrading silently to a default"
    as_of: "2026-09-06"
