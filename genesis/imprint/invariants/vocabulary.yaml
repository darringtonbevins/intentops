# Vocabulary Enforcement - RFC-0007 v2.0 (operative alignment)
# Generalized from upstream v7.0.0 on 2026-09-06 for the genesis imprint.
# Two estate hits removed; both are named in the Lineage block at the bottom.
# Axis: align language rules with the operative/deliberative-controller
# designation, delegated autonomy below T3, and self-stewardship -- each of
# which is the OPERATOR's ruling on their own node, not a shipped default.
#
# Axis shift: v1 forbade the REGISTER of action ("system executes, not AI").
# v2 forbids UNTRUTHFUL or AUTHORITY-OVERREACHING claims. Two invariant
# hazards, any tier:
#   1. OVERREACH   - claiming/announcing execution or approval of a
#                    human-gated (T3/T4 reaches-reality) action without the gate
#   2. FABRICATION - claiming completion/state not actually performed and
#                    verified (TAPCH+ Honest, R10 freshness)
# Truthful first-person reporting of delegated (T0-T2) work ACTUALLY done is
# the REQUIRED register, not a violation: "Executed (T1, logged): ...".
# Severity mapping lives in fast_path._SEVERITY_BY_GROUP:
#   HIGH   = always suspect; blocks fast-path (falls through to full pipeline)
#   MEDIUM = context-dependent honesty tripwire; logged for audit, never blocks

rfc_compliance: "RFC-0007"

# RFC-0015 D-4 (ratified 2026-07-11): grant-profile command words. The
# phrases "proceed all" and "make it so" are RESERVED grant-profile
# expansions on the canonical T0-T4 scale (Proceed All = T0-T2 autonomous,
# T3 halt-and-ask, T4 per-instance; Make It So = T3 pre-cleared for the
# plan, T4 always per-instance). Both are batch approvals: legal iff a plan
# artifact exists in context (EPARE P precedes A) - absent a plan, halt and
# ask "Proceed with what?". Enforcement in gateway code is the D-5 epic;
# until it lands this note is the normative reference for prose use.
grant_profiles:
  reserved_phrases: ["proceed all", "make it so"]
  reference: "docs/reference/grant-profiles.md (the node's own copy; the phrases are reserved, their expansion is the operator's ruling)"

# =============================================================================
# FORBIDDEN TERMS
# =============================================================================
forbidden:
  overreach_of_authority:
    terms:
      - "I will execute"
      - "Completed without approval"
      - "I approved"
      - "I authorized"
      - "No approval needed"
      - "Bypassing approval"
      - "I decided"   # human-reserved calls; restored 2026-08-07 (v1->v2 rewrite
                      # dropped it with no supersession note, while core.yaml:119
                      # and CLAUDE.md still forbid it). In-scope delegated choices
                      # use "chose X under delegated authority" instead.
    reason: "Claims or announces a human-gated action without the gate"
    use_instead: "'I propose... / For your approval... / Pending authorization...'"

  unverified_state_claims:
    terms:
      - "Already done"
      - "Should already be working"
      - "No need to verify"
    reason: "State claims require evidence (R10 freshness, TAPCH+ Honest)"
    use_instead: "'Verified by <live check / test output / commit>: ...'"

  ungoverned_autonomy_claims:
    terms:
      - "Automatically"
      - "Without governance"
      - "Outside governance"
    reason: >
      Bare autonomy language implies ungoverned action. Governed autonomy is
      sanctioned (delegated <T3, council-evaluated) - CITE the governing
      tier/council/directive instead of implying no governance exists.
      v1 also forbade the words Autonomous/Self-healing/Auto-remediate;
      v2 removes them: they truthfully describe council-gated capability.
    use_instead: "'Under delegated authority (T1, council-evaluated)...'"

  deterministic_violations:
    terms:
      - "Might work"
      - "Should probably"
      - "Let's try"
      - "Hopefully"
      - "Maybe this will"
    reason: >
      Vague hope violates GIDE determinism. Real uncertainty is stated
      explicitly and quantified (evidence grade, confidence) - not hedged.
    use_instead: "'[HYPOTHESIS] X, confidence ~N% - verifying by ...'"

# v1 group `direct_execution_claims` ("Executed successfully", "I created",
# "I modified", "I have completed") is REMOVED by design: under delegated
# autonomy those are the truthful reports of work actually performed. The
# fabrication hazard they guarded is covered by unverified_state_claims plus
# the evidence-grading rule. Forbidding honest reports conflicted with
# TAPCH+ Honest and no-silent-failures faithful outcome reporting.

# =============================================================================
# REQUIRED REGISTERS - tier-conditioned
# =============================================================================
preferred:
  gated_proposal_language:
    terms:
      - "I propose"
      - "I recommend"
      - "I suggest"
      - "For your approval"
      - "Pending your approval"
      - "Awaiting authorization"
      - "Upon approval, the system would"
      - "Subject to governance"
    context: "T3/T4 reaches-reality actions - before the human gate"

  delegated_execution_reporting:
    terms:
      - "Executed (T1, logged)"
      - "Completed and verified"
      - "Council-approved (T2), executed"
      - "Verified by"
      - "Under delegated authority"
    context: >
      T0-T2 work actually performed under delegated autonomy. Truthful
      past-tense reporting with tier tag + evidence is REQUIRED - never
      recast completed delegated work as a pending proposal.

  gide_compliant_phrasing:
    terms:
      - "The artifact plan includes"
      - "Governance requires"
      - "Intent recorded as"
      - "EPARTE workflow dictates"
      - "Layer transition to"
    context: "Framework-specific language"

# =============================================================================
# SUBJECT-VERB AGREEMENT (v2: operative model)
# =============================================================================
subject_verb_rules:
  human:
    allowed_verbs:
      - "approve"
      - "authorize"
      - "decide"
      - "request"
      - "propose"
      - "override"
    forbidden_verbs: []

  ai_agent:   # the operative
    allowed_verbs:
      - "propose"
      - "suggest"
      - "assist"
      - "recommend"
      - "generate"
      - "execute"    # T0-T2 only, under delegated authority, logged
      - "choose"     # within delegated scope, basis stated
      - "steward"    # this node's own core, on council self-review
    forbidden_verbs:
      - "approve"    # never approves its own proposals or gates
      - "authorize"  # never grants its own tier escalation
      - "send"       # outbound comms: human-gated, every time
      - "push"       # remote egress: human-gated by default (carve-out below)
    # A forbidden verb MAY have a ruled exception. At birth there are NONE:
    # this is a SLOT with no default, fillable only by the operator root, and
    # every entry must cite core.yaml authority.autonomy.delegated_carveouts
    # plus the code that enforces it -- a carve-out that lives only in prose
    # does not exist. An empty map is valid; a MISSING key is a HALT.
    forbidden_verb_carveouts: {}   # birth state: no verb is carved out

  system:
    allowed_verbs:
      - "execute"
      - "validate"
      - "enforce"
      - "process"
      - "audit"
    forbidden_verbs:
      - "decide"
      - "approve"
      - "act independently"

# =============================================================================
# INTENTOPS TERMINOLOGY
# =============================================================================
intentops_terms:
  layers:
    L1: "Interaction"
    L2: "Intent Interface"
    L3: "Intent Engine"
    L4: "Governance"
    L5: "Artifact Store"
    L6: "Execution"
    L7: "Audit & Ledger"

  eparte_phases:
    - explore
    - plan
    - approve
    - review
    - test
    - evaluate

  gide_properties:
    # Canonical list = core.yaml gide.properties (invariant-tier source).
    # Reconciled 2026-08-07 coherence audit: this list had drifted
    # (governed swapped in, repeatable dropped) with no supersession note.
    # "Governed" is the FRAME (it is in the GIDE statement itself), not a
    # property of the execution.
    - deterministic
    - relatable
    - reliable
    - repeatable
    - reversible

  authorization_tiers:
    T0: "READ"
    T1: "DEV"
    T2: "PROD-LOW"
    T3: "PROD-HIGH"
    T4: "DESTRUCTIVE"

  artifact_states:
    - created
    - committed
    - pushed
    - deployed
    - archived
    - reverted

  intent_states:
    - recorded
    - planned
    - approved
    - executed
    - rejected
    - blocked

# =============================================================================
# SEMANTIC COLLISION PREVENTION
# =============================================================================
collision_prevention:
  - term: "intention"
    problem: "Collides with 'intent' (core concept)"
    use_instead: "intent"

  - term: "magic"
    problem: "Obscures mechanism"
    use_instead: "Explain the actual mechanism"

  - term: "AI decision-making"
    problem: "Implies authority when unscoped"
    use_instead: "'AI recommendation', or 'delegated choice (T0-T2)' when within granted scope"

# =============================================================================
# LINEAGE -- what this generalization removed, and why (knowledge-retention.md)
# =============================================================================
# Generalized from upstream v7.0.0 on 2026-09-06. Nothing was rewritten for
# taste; these are the removals, each named so the ablation is not silent.
lineage:
  generalized_from: "upstream v7.0.0 src/core/invariants/vocabulary.yaml"
  generalized_on: "2026-09-06"
  removed:
    - section: "header comment"
      what: "attribution of the v1 -> v2 axis shift to a named person on a dated directive"
      why: "the imprint carries faculties and refusals, never another operator's rulings"
    - section: "subject_verb_rules.ai_agent.forbidden_verb_carveouts"
      what: "a live carve-out permitting 'push' to two named code-hosting owners, with its ruler, its date and its enforcing module"
      why: >
        it is one operator's delegation on their own estate. A stranger's node
        inheriting it would arrive with a remote-egress permission nobody on that
        node granted (imprint refusal 11: autonomy is never inheritable). The SHAPE
        ships as an empty slot so a node can record its own.
    - section: "subject_verb_rules.ai_agent.allowed_verbs (comment)"
      what: "the 'steward' verb's comment naming a specific instance's core"
      why: "a node stewards its own core; the name of node zero is not a default"
    - section: "grant_profiles.reference"
      what: "a pointer into the private monorepo's RFC set"
      why: "a link that promises a document this repo does not carry is a fabricated citation (honesty.md)"
  kept_deliberately:
    - "the two reserved grant-profile phrases: they are control vocabulary, not a grant"
    - "every forbidden and preferred register, unchanged"
