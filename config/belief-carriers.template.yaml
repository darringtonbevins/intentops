#     path: continuity/BOOT-ANCHORS.md
#     version_control: git
#     falsifiers: [EVIDENCE-MOVED, SUBJECT-GONE, UNDATED]
#
#   - id: memory-topics
#     kind: memory-topic
#     label: this node's memory topic files
#     base: identity-repo
#     path: continuity/memory
#     version_control: none
#     falsifiers: [SUBJECT-GONE, UNDATED]
# ---------------------------------------------------------------------------
