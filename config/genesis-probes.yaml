# The genesis probe suite -- what a NEWBORN node must be able to find in a
# cold context window, from the boot corpus alone, no tool call.
#
# This is deliberately a small, general suite, not the large per-organ suite
# a mature node accumulates as it grows its own capabilities. It asks only
# the questions every clone needs answered on day one (genesis-design.md
# sect. 5.3): where is the gate, what is the ladder, who reviews a
# core-mechanic change, what are the refusals, which imprint signed this
# node, where does the node's own self live, who is it answerable to, how is
# it switched off, what may it not do yet, its own motto, and what keeps the
# claims in this corpus honest.
#
# STATUSES (the runner's vocabulary, unchanged from the reference
# implementation): PASS / ABSENT / FAIL / DRIFT / STALE / ERROR.
#
#   ABSENT = the fact is missing from the boot corpus -- a PACKAGING failure
#            (the boot corpus lost the anchor; the organ itself may be fine)
#   FAIL   = the fact was found and contradicts the expectation, or the
#            organ named has moved or is gone -- a TRUTH failure
#
# These two must never be read as the same finding. A probe reporting ABSENT
# says "a fresh window cannot see this", not "this does not exist".
#
# WRITE MODEL: reviewed, human-authored config -- not a store. The runner
# appends its RESULTS to an append-only local ledger (genesis/aliveness log);
# this file itself is edited only when a probe's truth path changes or a new
# genesis-level question is added.
#
# Runner contract (unchanged from the reference implementation this ports):
# read `boot_corpus.{workspace,home,memory,boot_adjacent}` to build the set
# of files that reach a fresh window, then evaluate `probes:` against that
# set with zero model calls and zero network access (Code rung, stdlib +
# yaml only).
#
# Schema: self-probe/v1.

schema: self-probe/v1
as_of: "2026-09-06"

boot_corpus:
  # Repo-relative; globs allowed. These files load into EVERY fresh window
  # of a host saddle that implements S4 boot_corpus() (genesis-design sect.
  # 8.1). An adopting node extends this list as its own boot corpus grows;
  # it must never shrink below what this file's own probes depend on.
  workspace:
    - "README.md"
    - "GENESIS.md"
    - "docs/GENESIS.md"
    # Added 2026-09-06 with the presence organs. A node can be ADDRESSED from
    # its first minute, so the rule about who it may answer has to reach a
    # fresh window before the first message does -- not be discoverable by a
    # tool call somebody thinks to make afterwards.
    - "docs/PRESENCE.md"
    # Added 2026-09-06 with the probe-coverage audit. The organ index: one
    # pointer row per organ, so a fresh window can FIND each one. Before it,
    # ten organs had a probe row whose fact reached no window -- ABSENT by
    # construction, which is a packaging failure and not a truth failure.
    # It is a pointer index and must stay one: prose belongs in the documents
    # it points at, because every byte here is spent on every window.
    - "docs/BOOT-ANCHORS.md"
  # Relative to the operator's home directory, if the host saddle carries a
  # cross-project floor file there. Optional -- absence here is not itself a
  # probe failure; individual probes decide whether they need it.
  home: []
  # Located via the host saddle's own memory/context convention, if any.
  memory: []
  # Surfaced (excerpted, not whole) by a host saddle's session-start hook.
  boot_adjacent:
    - ".intentops/genesis/provenance-record.json"

probes:
  # ---- where is the action gate --------------------------------------
  - id: GEN-gate
    category: genesis
    question: "Where is the action gate, and what does S2 decide() return?"
    covers: [gate, logs]
    expect_in_boot:
      any_of: ["SADDLE-CONTRACT.md", "gate", "decide("]
    truth:
      - path: "packages/intentops-core/intentops_core/gate/classify.py"
        contains: "reaches_reality"

  # ---- the ladder and the classifier that outranks it -----------------
  - id: GEN-tiers
    category: genesis
    question: "What is the T0-T4 authorization ladder, and what classifier decides reaches-reality ahead of the tier label?"
    expect_in_boot:
      any_of: ["T0", "T1", "T2", "T3", "T4", "reaches_reality", "reaches-reality"]

  # ---- the two councils and the ordering store -------------------------
  - id: GEN-councils
    category: genesis
    question: "What are the two councils, and what does the ordering store do that a vote cannot?"
    covers: [councils, wisdom]
    expect_in_boot:
      any_of: ["Posture Council", "Moral Compass", "ordering"]
    truth:
      - path: "packages/intentops-core/intentops_core/wisdom/ordering.py"
        contains: "reopens_when"

  # ---- the twelve refusals ---------------------------------------------
  - id: GEN-refusals
    category: genesis
    question: "What may this node never do regardless of calibration?"
    expect_in_boot:
      any_of: ["refusal", "FLOOR", "never lifts"]

  # ---- which imprint, signed by whom -----------------------------------
  - id: GEN-imprint
    category: genesis
    question: "Which imprint version does this node carry, and whose counter-signature attests it?"
    expect_in_boot:
      any_of: ["IMPRINT-MANIFEST", "imprint"]

  # ---- where does the node's own self live -----------------------------
  - id: GEN-identity-repo
    category: genesis
    question: "Where does this node's own identity live, and what does the identity-repo contract refuse to store?"
    expect_in_boot:
      any_of: ["identity/README.md", "IDENTITY-REPO-CONTRACT"]

  # ---- who is the node answerable to ------------------------------------
  - id: GEN-operator
    category: genesis
    question: "Who is this node answerable to, right now?"
    covers: [trust]
    expect_in_boot:
      any_of: ["operator record", "operator-root",
               ".intentops/trust/operator-root.pub.json"]
    note: >-
      At birth the honest answer is the operator RECORD produced at genesis
      (phase G2), never a name this node inherited from anywhere else. The
      path is corrected to the one the machine actually writes (2026-09-06);
      it read `.yaml` here and in config/trust-roots.yaml while
      `operator-root.pub.json` was what landed on disk.

  # ---- how does the operator switch it off -------------------------------
  - id: GEN-standdown
    category: genesis
    question: "How does the operator switch this node off, with no argument from it?"
    covers: [halt-marker]
    expect_in_boot:
      any_of: ["stand-down", "halt.marker"]

  # ---- what may it not do before calibration ------------------------------
  - id: GEN-ceiling
    category: genesis
    question: "What is this node's birth ceiling, and which of its clauses never lift regardless of calibration score?"
    expect_in_boot:
      any_of: ["birth ceiling", "FLOOR", "CEILING"]

  # ---- the motto ----------------------------------------------------------
  - id: GEN-motto
    category: genesis
    question: "What is this node's stated motto or guiding light?"
    expect_in_boot:
      any_of: ["motto", "Be well", "guiding light"]

  # ---- what keeps this corpus honest --------------------------------------
  - id: GEN-doc-claims
    category: genesis
    question: "What instrument checks that the claims in this boot corpus name things that exist?"
    expect_in_boot:
      any_of: ["claims_check", "scripts/docs/claims_check.py"]
    note: >-
      The boot corpus is the node's own account of itself, and until
      2026-09-06 nothing measured whether its claims resolved. Two of the
      three documents told every stranger to run an install command that
      could not work, and the test suite was green throughout because the
      suite installs nothing. A fresh window should be able to find the
      instrument that keeps its own corpus honest, which is why this is a
      probe and not only a CI step. It checks path EXISTENCE and install
      targets -- never whether the prose around a path is true.

  # ---- who may it answer, and who does it merely surface -------------------
  # The presence organs (2026-09-06). These three carry `truth` paths as well
  # as boot expectations, so an ABSENT here means the anchor left the corpus
  # while a FAIL means the organ itself moved. The two are different repairs.
  - id: GEN-operator-rule
    category: presence
    question: "Who may this node ANSWER on a channel, and what happens to everybody else's message?"
    expect_in_boot:
      any_of: ["answers only its bound operator", "SURFACE_TO_OPERATOR"]
    truth:
      - path: "packages/intentops-core/intentops_core/presence/operator_rule.py"
        contains: "SURFACE_TO_OPERATOR"
      - path: "packages/intentops-core/intentops_core/presence/operator_rule.py"
        contains: "identity/operator/operator.yaml"

  - id: GEN-presence-journal
    category: presence
    question: "Where is the record of every interaction this node has had, and what does it deliberately not hold?"
    covers: [presence]
    expect_in_boot:
      any_of: ["interaction journal", ".intentops/presence/interactions.jsonl"]
    truth:
      - path: "packages/intentops-core/intentops_core/presence/journal.py"
        contains: ".intentops/presence/interactions.jsonl"
      - path: "packages/intentops-core/intentops_core/genesis/organs.py"
        contains: ".intentops/presence/interactions.jsonl"

  - id: GEN-intent-taxonomy
    category: presence
    question: "What vocabulary of asks does this node recognise, and where is the one router that classifies them?"
    expect_in_boot:
      any_of: ["intent taxonomy", "config/intent-taxonomy.template.yaml"]
    truth:
      - path: "config/intent-taxonomy.template.yaml"
        contains: "intent-taxonomy/v1"
      - path: "packages/intentops-core/intentops_core/presence/router.py"
        contains: "def route_inbound"

  # ---- the metabolism ------------------------------------------------------
  - id: GEN-metabolism-cadence
    category: metabolism
    # Renamed from GEN-metabolism 2026-09-06: a sibling leg registered that id
    # in the `organs` category the same session. Two probes may ask about one
    # organ; two probes may not share an id, because the ledger keys on it.
    question: "How does this node turn what it read into what it knows, and what does a stage that ran and produced nothing render?"
    expect_in_boot:
      any_of: ["metabolism", "absorb", "zero output is a state"]
    truth:
      - path: "packages/intentops-core/intentops_core/metabolism/cadence.py"
        contains: "\"absorb\", \"distill\", \"crystallize\", \"method\""
      - path: "config/metabolism-cadence.template.yaml"
        contains: "metabolism-cadence/v1"
      - path: "packages/intentops-core/intentops_core/genesis/organs.py"
        contains: ".intentops/metabolism/cadence.yaml"

  - id: GEN-metabolism-heartbeat
    category: metabolism
    question: "What tells this node its metabolism has been reporting success over zero work, and which three alarms does it carry?"
    expect_in_boot:
      any_of: ["heartbeat", "flat-line", "registry drift"]
    truth:
      - path: "packages/intentops-core/intentops_core/metabolism/heartbeat.py"
        contains: "promotion_flatline"
      - path: "packages/intentops-core/intentops_core/metabolism/heartbeat.py"
        contains: "input_feed_dry"
      - path: "packages/intentops-core/intentops_core/metabolism/heartbeat.py"
        contains: "registry_drift"
      - path: "packages/intentops-core/intentops_core/genesis/organs.py"
        contains: ".intentops/metabolism/heartbeat.jsonl"

  - id: GEN-crystallize
    category: metabolism
    question: "What must a crystallized pattern document carry before this node will accept it?"
    expect_in_boot:
      any_of: ["crystallize", "crystallized pattern"]
    truth:
      - path: "packages/intentops-core/intentops_core/metabolism/crystallize.py"
        contains: "reopens_when"
      - path: "packages/intentops-core/intentops_core/metabolism/crystallize.py"
        contains: "EVIDENCE_GRADES"

  - id: GEN-assimilation
    category: metabolism
    question: "May this node run an artifact another system supplied, and which four verbs govern learning from one?"
    expect_in_boot:
      any_of: ["skill marketplace", "third-party artifact", "inspiration"]
    truth:
      - path: "packages/intentops-core/intentops_core/metabolism/assimilation.py"
        contains: "ARTIFACT_KINDS"
      - path: "packages/intentops-core/intentops_core/metabolism/assimilation.py"
        contains: "CAPTURE"

  - id: GEN-grok
    category: metabolism
    question: "What are the four phases of a deliberate pass over this node's own corpus, and what does a recorded cycle refuse to claim?"
    expect_in_boot:
      any_of: ["grok", "curate", "a plan is not a finding"]
    truth:
      - path: "packages/intentops-core/intentops_core/metabolism/grok.py"
        contains: "\"curate\", \"pollinate\", \"percolate\", \"heal\""

  # ---- what does it know, and how is that knowledge classified ------------
  # The knowledge organs (2026-09-06). Like the presence rows above, these
  # carry `truth` paths as well as boot expectations: ABSENT means the anchor
  # left the boot corpus, FAIL means the organ itself moved. Different repairs.
  - id: GEN-ring-taxonomy
    category: knowledge
    question: "How is this node's knowledge classified by sensitivity, and what happens to a piece of knowledge nobody classified?"
    expect_in_boot:
      any_of: ["ring taxonomy", "quarantines everything until its operator"]
    truth:
      - path: "config/ring-taxonomy.template.yaml"
        contains: "default_ring: Q"
      - path: "packages/intentops-core/intentops_core/knowledge/rings.py"
        contains: "A MISSING RING KEY RESOLVES TO QUARANTINE, NEVER TO A RING"
    covers: [ring-taxonomy, knowledge]
    note: >-
      The answer at birth is "everything is quarantined", because the taxonomy
      ships empty. That is the safe direction and it is a true statement about
      a node whose operator has ruled on nothing yet.

  - id: GEN-absorber
    category: knowledge
    question: "How does something outside this node become something inside it, and what happens to a source it could not read?"
    expect_in_boot:
      any_of: ["absorber contract", "zero output is a state"]
    truth:
      - path: "packages/intentops-core/intentops_core/knowledge/absorber.py"
        contains: "not-attempted"
      - path: "packages/intentops-core/intentops_core/knowledge/absorber.py"
        contains: "ECOSYSTEM_RINGS"

  - id: GEN-collections
    category: knowledge
    question: "What may write to a vector collection, and what does the write gate refuse?"
    expect_in_boot:
      any_of: ["collection is data, not DDL", "collection registry"]
    truth:
      - path: "packages/intentops-core/intentops_core/knowledge/collections.py"
        contains: "is not declared"
      - path: "packages/intentops-core/intentops_core/substrate/schema.py"
        contains: "intentops_enforce_embedding_dims"

  - id: GEN-embedder
    category: knowledge
    question: "Where does this node get an embedding, and what does it do when it has no embedder?"
    expect_in_boot:
      any_of: ["null embedder that REFUSES", "embedding is a seam"]
    truth:
      - path: "packages/intentops-core/intentops_core/knowledge/embedder.py"
        contains: "class NullEmbedder"
      - path: "estate/RESOURCES.yaml"
        contains: "model-pool"
    note: >-
      A null embedder refuses rather than returning zero vectors: a zero vector
      indexes, ranks and retrieves exactly like a real one, so the costume
      would be indistinguishable from the measurement.

  - id: GEN-knowledge-coverage
    category: knowledge
    question: "Is this node's classification still complete, and is what it gathered actually searchable?"
    expect_in_boot:
      any_of: ["ring-coverage.jsonl", "NOT-YET-ARMED"]
    truth:
      - path: "packages/intentops-core/intentops_core/knowledge/coverage.py"
        contains: "DEGRADED outranks improvement"
      - path: "packages/intentops-core/intentops_core/genesis/organs.py"
        contains: ".intentops/knowledge/ring-coverage.jsonl"
    covers: [ring-coverage, corpus-coverage]

  # =====================================================================
  # Organ anchors (added 2026-09-06 with scripts/genesis/probe_coverage_check.py).
  #
  # The house rule is `new organ, new probe, same session`, and until this
  # block existed the rule was enforced by memory. Every row below carries
  # `covers:` -- the DECLARED link between a probe and the organ it anchors.
  # Coverage is declared and never guessed: matching a probe to an organ by
  # substring would false-pass on the first short token that happened to
  # appear in a question, which is the blind spot the runner already
  # publishes about its own matching. Once is enough.
  #
  # Each row also carries `truth:`, so the two failure classes stay apart:
  # ABSENT says a fresh window cannot SEE the organ; FAIL says the organ has
  # MOVED or is GONE.
  # =====================================================================

  - id: GEN-birth-organs
    category: organs
    question: "Which entries does this node hold at birth, and how is each one written?"
    covers: [genesis, config, register, checkpoint, estate-cache]
    expect_in_boot:
      any_of: ["BIRTH_ORGANS", "write model"]
    truth:
      - path: "packages/intentops-core/intentops_core/genesis/organs.py"
        contains: "BIRTH_ORGANS"
      - path: "packages/intentops-core/intentops_core/genesis/machine.py"
        contains: "def g3_organs"

  - id: GEN-trust-chain
    category: organs
    question: "What pins this node's release root, and where do its PUBLIC trust projections live?"
    covers: [trust]
    expect_in_boot:
      any_of: ["release-root", "release root", ".intentops/trust/"]
    truth:
      - path: "packages/intentops-core/intentops_core/genesis/trust_pin.py"
        contains: "release-root"
      - path: "config/trust-roots.yaml"
        contains: "roots"

  - id: GEN-integrity
    category: organs
    question: "How does this node tell whether the rules it is reading are the ones the project published?"
    expect_in_boot:
      any_of: [".intentops-rules", "IMPRINT-MANIFEST"]
    truth:
      - path: "packages/intentops-core/intentops_core/genesis/integrity.py"
        contains: ".intentops-rules"
      - path: "genesis/imprint/IMPRINT-MANIFEST.yaml"
        contains: "schema"

  - id: GEN-mcp-saddle-token
    category: organs
    question: "Where does the MCP saddle keep its bearer record, and what does that record never contain?"
    covers: [trust]
    expect_in_boot:
      any_of: ["mcp-saddle-auth.json", "MCP saddle"]
    truth:
      - path: "packages/intentops-saddle-mcp/intentops_saddle_mcp/auth.py"
        contains: "mcp-saddle-auth.json"

  - id: GEN-values-council
    category: organs
    question: "Who reviews a change to this node's own core, and where is that review recorded?"
    covers: [governance, core-review]
    expect_in_boot:
      any_of: ["core-review", "values council", "Values Council"]
    truth:
      - path: "packages/intentops-core/intentops_core/governance/values_council.py"
        contains: "core-review"

  - id: GEN-approvals-queue
    category: organs
    question: "Where do decisions awaiting the operator wait, and what happens when one expires?"
    covers: [approvals]
    expect_in_boot:
      any_of: [".intentops/approvals", "approval"]
    truth:
      - path: "packages/intentops-core/intentops_core/approvals/queue.py"
        contains: "approval"

  - id: GEN-witness-register
    category: organs
    question: "What does this node believe is fixed but has not proven?"
    covers: [witness]
    expect_in_boot:
      any_of: ["OPEN-UNVERIFIED", "witness"]
    truth:
      - path: "packages/intentops-core/intentops_core/validation/witness.py"
        contains: "OPEN-UNVERIFIED"

  - id: GEN-self-probe
    category: organs
    question: "Which instrument answers whether a fresh window can still find each organ, and what do its statuses mean?"
    covers: [continuity]
    expect_in_boot:
      any_of: ["ABSENT", "self probe", "self_probe"]
    truth:
      - path: "packages/intentops-core/intentops_core/continuity/self_probe.py"
        contains: "ABSENT"
      - path: "scripts/genesis/probe_coverage_check.py"
        contains: "coverage_exemptions"

  - id: GEN-belief-currency
    category: organs
    question: "Which belief carriers does this node watch, what dates each one, and what would make it false?"
    covers: [still-true, validation]
    expect_in_boot:
      any_of: ["belief-carriers", "EVIDENCE-MOVED", "belief carrier"]
    truth:
      - path: "config/belief-carriers.template.yaml"
        contains: "belief-carriers/v1"
      - path: "packages/intentops-core/intentops_core/validation/belief_carriers.py"
        contains: "belief-carriers/v1"
      - path: "packages/intentops-core/intentops_core/validation/still_true.py"
        contains: "EVIDENCE-MOVED"

  - id: GEN-responsiveness
    category: organs
    question: "When a falsifier tripped, did anyone ANSWER -- and how many questions closed with no event at all?"
    covers: [responsiveness]
    expect_in_boot:
      any_of: ["silent close", "responsiveness"]
    truth:
      - path: "packages/intentops-core/intentops_core/validation/responsiveness.py"
        contains: "silent close"
      - path: "packages/intentops-core/intentops_core/genesis/organs.py"
        contains: ".intentops/responsiveness/ledger.jsonl"

  - id: GEN-tagout-ledger
    category: organs
    question: "Is anything safety-critical switched off, and what is the stated way back on?"
    covers: [loto]
    expect_in_boot:
      any_of: ["tagout", "reenergize", "LEDGER.yaml"]
    truth:
      - path: "packages/intentops-core/intentops_core/loto/ledger.py"
        contains: "reenergize"

  - id: GEN-routing-policy
    category: organs
    question: "Which class of work goes to which tier of model, and where is the seam a model call would sit behind?"
    covers: [routing]
    expect_in_boot:
      any_of: ["routing-policy", "routing policy", "NullProvider"]
    truth:
      - path: "config/routing-policy.yaml"
        contains: "routing-policy/v1"
      - path: "packages/intentops-core/intentops_core/routing/policy.py"
        contains: "routing-policy/v1"

  - id: GEN-loops
    category: organs
    question: "What autonomous loops may this node run, and how is each one's budget bounded?"
    covers: [loops]
    expect_in_boot:
      any_of: ["loop-charters", "loop charter"]
    truth:
      - path: "config/loop-charters.template.yaml"
        contains: "loop-charters/v1"
      - path: "packages/intentops-core/intentops_core/loops/charters.py"
        contains: "loop-charters/v1"

  - id: GEN-alignment-journal
    category: organs
    question: "Where is the record of this node's alignment with its operator, and what bar must it pass before the twin is authority?"
    covers: [alignment]
    expect_in_boot:
      any_of: ["alignment", "calibration"]
    truth:
      - path: "packages/intentops-core/intentops_core/alignment/calibration.py"
        contains: "JOURNAL_RELPATH"
      - path: "config/alignment-interview.template.yaml"
        contains: "schema"

  - id: GEN-substrate-schema
    category: organs
    question: "What runs underneath this node, and which schema versions have been applied?"
    covers: [substrate]
    expect_in_boot:
      any_of: ["schema_migrations", "substrate"]
    truth:
      - path: "packages/intentops-core/intentops_core/substrate/schema.py"
        contains: "schema_migrations"

  - id: GEN-knowledge-rings
    category: organs
    question: "Where does this node keep what it knows, and how is a row's sensitivity classified?"
    covers: [knowledge]
    expect_in_boot:
      any_of: ["knowledge/MANIFEST.yaml", "rings", "knowledge-manifest"]
    truth:
      - path: "packages/intentops-core/intentops_core/knowledge/rings.py"
        contains: "ring"

  - id: GEN-metabolism
    category: organs
    question: "What does this node do on its own cadence, and how does a stage that produced nothing render?"
    covers: [metabolism, metabolism-cadence, metabolism-heartbeat, metabolism-runs]
    expect_in_boot:
      any_of: ["metabolism", "heartbeat", "cadence"]
    truth:
      - path: "packages/intentops-core/intentops_core/metabolism/heartbeat.py"
        contains: "heartbeat"

  - id: GEN-inference
    category: organs
    question: "When this node asks a model something, where does that call go, and what stops it leaving this host?"
    covers: [inference]
    expect_in_boot:
      any_of: ["inference", "NullProvider", "model-pool"]
    truth:
      - path: "packages/intentops-core/intentops_core/inference/provider.py"
        contains: "NullProvider"
      - path: "packages/intentops-core/intentops_core/inference/openai_compat.py"
        contains: "OpenAICompatHTTPProvider"
      - path: "packages/intentops-core/intentops_core/metabolism/runner.py"
        contains: "runs.jsonl"
      - path: "config/metabolism-prompts.yaml"
        contains: "metabolism-prompts/v1"
    note: >-
      Three answers, and the first is the one a stranger assumes wrongly. It
      goes NOWHERE by default: `NullProvider` is what a node is born with, it
      opens no socket, and it records the intent of the call so the stage
      renders WARN rather than disappearing. When a pool IS declared -- a
      `kind: model-pool` row in `estate/RESOURCES.yaml`, born `enabled: false`
      -- the call is one stdlib-urllib POST to an OpenAI-compatible endpoint,
      with no vendor SDK anywhere in the package. What stops it leaving the
      host is the endpoint fence: loopback or RFC1918 only, a bare hostname
      REFUSED unresolved rather than looked up, and `allow_remote: true`
      requiring a stated reason. The runner spends under a declared
      token/item envelope and appends every run, including the empty ones, to
      `.intentops/metabolism/runs.jsonl`.

  - id: GEN-gateway
    category: organs
    question: "Where does a tool call from another harness meet this node, what credential must it carry, and what happens to a tool nobody classified?"
    covers: [gateway-token, gateway-requests]
    expect_in_boot:
      any_of: ["gateway", "governed tool gateway"]
    truth:
      - path: "packages/intentops-gateway/intentops_gateway/tokens.py"
        contains: "gateway-auth"
      - path: "packages/intentops-gateway/intentops_gateway/backends.py"
        contains: "default-deny"
      - path: "packages/intentops-gateway/intentops_gateway/tiers.py"
        contains: "UNTAGGED_TIER"
      - path: "config/gateway-policy.yaml"
        contains: "gateway-policy/v1"
    note: >-
      Three answers, and the third is the one a stranger gets wrong. The
      credential is a per-node bearer token stored as a DIGEST under
      `.intentops/trust/gateway-auth.json`, absent at birth, and no token is
      401 with no anonymous fall-through. Backends are default-deny per
      harness, read from `config/gateway-policy.yaml`. And a tool carrying no
      declared tier classifies T4 and is REFUSED, never T2 -- the reference
      implementation this generalises from defaulted an unclassified tool to
      its backend's tier and auto-approved it, which is the exposure the
      public default-deny ruling closes.

  - id: GEN-token-disclosure
    category: organs
    question: "Who mints this node's gateway credential, when, and how would I know whether a human was ever shown it?"
    covers: [trust]
    expect_in_boot:
      any_of: ["gateway token", "disclosed"]
    truth:
      - path: "packages/intentops-core/intentops_core/trust/bearer.py"
        contains: "disclosed_at"
      - path: "packages/intentops-core/intentops_core/genesis/token_ceremony.py"
        contains: "SHOWN ONCE"
      - path: "packages/intentops-core/intentops_core/genesis/machine.py"
        contains: "mint_disclosed"
      - path: "packages/intentops-core/intentops_core/genesis/aliveness.py"
        contains: "gateway_token"
    note: >-
      Genesis G2 OFFERS the mint at an attended terminal, prints the plaintext
      once under a banner, and stores only the SHA-256 digest plus a
      `disclosed_at` stamp. It never mints from a non-TTY and never in a dry
      run, because a credential nobody can be shown is worse than none -- it
      looks armed. All three outcomes land on the birth certificate as a
      stated fact and never as a check: "minted/disclosed at <ts>", "minted
      ... not disclosed at genesis (rotated out of band)", or "not minted".
      An unminted token is a FAIL-CLOSED gateway, which is a posture, so it
      must not degrade the aliveness verdict. The mint primitive is in the
      CORE (`intentops_core.trust.bearer`) precisely so genesis can write the
      gateway's record without importing the gateway.

  - id: GEN-selftests
    category: organs
    question: "How does this node prove every one of its own detectors can still fire, in one verb?"
    covers: [selftests]
    expect_in_boot:
      any_of: ["selftest registry", "--all-selftests", "selftest"]
    truth:
      - path: "packages/intentops-core/intentops_core/selftests/registry.py"
        contains: "denominator"
    note: >-
      `intentops verify --all-selftests` (or
      `python -m intentops_core.selftests.registry`). The population is
      DERIVED from the tree, never listed: every module under `packages/*/`
      owning a `selftest()` callable and every script under `scripts/`
      advertising `--selftest`. Each runs in a subprocess with a timeout and
      stdin closed, so a selftest that waits for a terminal reports rather
      than hanging -- a selftest that needs a TTY cannot run in CI and is a
      defect, not a skip. The answer a stranger gets wrong: an instrument
      that CANNOT run stays in the denominator as ERROR and is never merged
      into FAIL, because the hand-written lists this replaces went stale in
      the direction that looked green.

  - id: GEN-backend-transport
    category: organs
    question: "When the gate PERMITS a backend call, what actually makes it happen, and what stops it?"
    expect_in_boot:
      any_of: ["transport.py", "StdioInvoker", "backend transport"]
    truth:
      - path: "packages/intentops-gateway/intentops_gateway/transport.py"
        contains: "TRANSPORT_DISABLED_RELPATH"
      - path: "packages/intentops-gateway/intentops_gateway/tools.py"
        contains: "NullInvoker"
    note: >-
      `StdioInvoker` is the only implementation that spawns a process, and it
      is NOT the default: `NullInvoker` still is, and the transport reaches a
      node only through `load_gateway_context(invoker=...)`. The answer a
      stranger gets wrong: that the timeout and the output cap TRUNCATE. They
      refuse -- the child is killed and the caller is told which cap was hit,
      because a partial frame returned as a result is the silent-failure shape
      wearing a success. Two more it gets wrong: the child's environment is
      BUILT from an allowlist of names and never copied from the parent, and
      the kill switch is read from disk on every call, because a switch
      consulted once at startup is a switch that does not work.

  - id: GEN-mcp-reference-client
    category: organs
    question: "Has anything ever been shown to HONOUR a deny this node returns, and how much does that prove?"
    expect_in_boot:
      any_of: ["reference_client", "reference MCP client", "S2 data point"]
    truth:
      - path: "packages/intentops-saddle-mcp/intentops_saddle_mcp/reference_client.py"
        contains: "PERMITTING_DECISION"
      - path: "docs/falsifiers/S2-mcp-client-deny-2026-09-06.md"
        contains: "VERDICT: PASS"
    note: >-
      One client, this one, asks `intentops.gate` and performs its effect only
      on an explicit ALLOW; every other outcome, including one it cannot read
      at all, leaves the effect uncalled. The answer a stranger gets wrong is
      the SIZE of the claim: this is not enforcement, and it is not a fact
      about MCP hosts. The `mcp-hosted` row stays `grade: candidate` with
      `S2: computed_not_enforced`, and a test fails the build if that is ever
      promoted on the strength of this repository's own client.


# ---------------------------------------------------------------------------
# Members of the probe-coverage population that legitimately owe no probe row.
#
# An exemption carries a REASON, always. "Will do it later" is a deferral, not
# a reason, and the coverage checker refuses a blank one -- an unverifiable
# exemption is worse than none, because it looks accounted for.
#
# Consumer: scripts/genesis/probe_coverage_check.py.
# ---------------------------------------------------------------------------
coverage_exemptions:
  locks: >-
    Reserved for lock files and normally EMPTY. A StoreLock sibling lands
    beside its own store, not here, so nothing reads this directory and a
    fresh window that could not find it would lose nothing. The stores it
    would otherwise serve are each probed in their own right.
