# The exposure fence -- what must never appear in this repository.
#
# PURPOSE
#   IntentOps is extracted from a private working estate. The extraction is
#   only safe if the seam is MECHANICAL: a reviewer's attention is not an
#   instrument, and "we were careful" is not a finding. This file is the
#   machine-readable half of that seam, and `scripts/ops/exposure_gate.py` is
#   the reader. CI runs the gate on every push; a hit is a red build.
#
# WHY THE DENYLIST IS HASHED, AND WHAT THAT DOES NOT MEAN
#   A denylist written in plaintext would put every fenced token into the very
#   repository the fence exists to keep them out of -- the gate would flag its
#   own configuration, and the extraction would ship the words it was built to
#   remove. So each entry carries the SHA-256 of the lowercased token instead.
#
#   This is a FENCE-COMPLIANCE measure, not secrecy. These are short dictionary
#   and proper-noun words; anyone who wants them back can recover them with a
#   wordlist in seconds. Nothing here should ever be described as protecting a
#   secret. It exists so the repository can carry a working denylist without
#   carrying the denied words.
#
# WRITE MODEL
#   Reviewed, human-authored config. Locked fresh-read RMW is not needed: this
#   file has exactly one writer (a reviewed commit) and no runtime writer. A
#   token is ADDED by computing its digest outside this repository and pasting
#   the digest; a token is never removed without a named, dated reason in the
#   commit that removes it -- a shrinking fence is a decision, not a cleanup.
#
# BLIND SPOTS -- stated so nobody reads a green gate as a clean bill of health
#   * A hash denylist finds only what it was told to look for. A private name
#     nobody thought of is invisible to it, and a green run says nothing about
#     that population. The three-clause form applies: I looked for these
#     tokens and these shapes; my sensitivity is exact-token and regex; I found
#     nothing; therefore nothing of THIS kind is present above THAT sensitivity.
#   * Short tokens (< 6 characters) match whole words only. A short token
#     embedded inside a longer proper noun is missed. The alternative floods
#     every ordinary English word that happens to contain those letters, and a
#     gate that fires constantly is a gate that gets routed around.
#   * Long tokens match as substrings, so some ordinary English words WILL be
#     flagged. That is the fail-toward-flagging direction and it is deliberate.
#     Clear a genuine false positive with an allowed-line marker, never by
#     deleting the entry.
#   * The gate reads files. It does not read git history, and a token removed
#     from the working tree may still sit in an earlier commit.
#   * Binary files are skipped by extension and by a null-byte probe. A token
#     inside an archive, an image, or a compiled artifact is not seen.
#   * An exemption does not make the gate cleaner, it makes the gate BLINDER,
#     and the two are indistinguishable from the outside because the number
#     gets BETTER. This gate shipped that way for one revision: `allowed_paths`
#     exempted the three files from every token, the scan read CLEAN across the
#     repository, and the hits it was stepping over were in the most sensitive
#     prose we ship -- found only once the exemption was narrowed to
#     `allowed_path_tokens` and every list set empty (see that block below).
#     Nothing looked wrong, because a shrinking denominator and a real repair
#     both render as green. Before widening any exemption here, state how many
#     files and how many token-checks it removes from the population, and read
#     the next CLEAN verdict as covering only what remains.

schema: exposure-fence/v1
as_of: "2026-09-06"

digest:
  algorithm: sha256
  encoding: ascii
  case: lowercase
  # No salt, deliberately: a salt would make the digests unverifiable by
  # anyone reproducing this file, and it would buy no secrecy the paragraph
  # above has not already disclaimed.
  salted: false

# Match modes, closed vocabulary. An undeclared mode is a HALT in the reader,
# never a default of "probably substring".
match_modes:
  word: >-
    the whole extracted word must equal the token. Used for tokens under six
    characters, where substring matching collides with ordinary English.
  substring: >-
    any run of `length` characters inside an extracted word may equal the
    token. Used for tokens of six characters or more.

