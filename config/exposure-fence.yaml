# Shapes, not names. These need no hashing -- a regex for an address is not an
# address. Each names the error it trades against (SIG-1 clause 7: a detector
# states its operating point).
patterns:
  - id: email-shaped
    regex: "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}"
    catches: "a real correspondent, wherever an example was meant"
    trades: "flags a genuine example address unless its domain is reserved below"
  - id: guid-shaped
    regex: "\\b[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}\\b"
    catches: "a tenant, subscription, or application identifier carried over from the estate"
    trades: "flags a deliberately illustrative identifier; use a marker for those"
  - id: record-key-shaped
    regex: "\\b[0-9]{4,6}-[0-9]{3,6}\\b"
    catches: "a composite record key of the private estate's shape, which resolves to a party"
    trades: "flags some version ranges and numeric spans; markers clear those"
  - id: private-key-block
    regex: "-----BEGIN [A-Z ]*PRIVATE KEY-----"
    catches: "key material pasted into the tree"
    trades: "nothing -- there is no legitimate reason for this string to exist here"

# Reserved-for-documentation domains (RFC 2606 / RFC 6761). An address at one
# of these is an example by definition and never a correspondent.
allowed_email_domains:
  - example.com
  - example.org
  - example.net
  - example.edu
  - localhost
  - invalid

# The files that carry the first-instance node's own words or its attribution,
# where a name is the point rather than a leak: the imprint is a first-person
# text; the archetype catalogue reserves that first instance's entry by name;
# the imprint manifest names the author whose counter-signature it defines; the
# identity-repo README states which node was the first conformant instance; and
# the identity-repo contract is the shape that instance satisfies.
#
# Corrected 2026-09-06: this list read three entries and named the CONTRACT as
# the file identifying the first instance. It does not -- it says only "exists
# privately". The sentence that names the instance lives in identity/README.md,
# and the author attribution lives in the imprint manifest, so the config and
# the tree disagreed. They now agree. The contract stays listed: it is the same
# class of file and a later edit may legitimately name the instance there.
allowed_paths:
  - genesis/imprint/IMPRINT.md
  - genesis/imprint/IMPRINT-MANIFEST.yaml
  - genesis/imprint/archetypes/CATALOGUE.yaml
  - identity/README.md
  - docs/IDENTITY-REPO-CONTRACT.md

# WHICH tokens each allowed path may carry -- and the answer today is NONE.
#
# This is deliberately not "allowed_paths are exempt from the whole denylist".
# A whole-file exemption puts a blind spot over the most sensitive prose in the
# repository, and it would look exactly like a clean scan: the gate would go
# green because it stopped looking, not because there was nothing to find. That
# is the failure mode of an untagged switch, where off-by-design and
# off-by-neglect are indistinguishable from outside.
#
# The name those files legitimately carry is the first instance's OWN name,
# which is not on the denylist above and therefore needs no exemption.
# Everything on the denylist is a private-estate name, and none of these files
# is a place for one. So every list here is empty, and the gate scans those
# files like any other.
#
# An empty list means NO token is exempt for that path. There is no value that
# means "all" -- if one existed, someone would eventually reach for it.
# A path here that is not in `allowed_paths`, or a token id that is not in
# `tokens`, is a HALT rather than a shrug.
allowed_path_tokens:
  genesis/imprint/IMPRINT.md: []
  genesis/imprint/IMPRINT-MANIFEST.yaml: []
  genesis/imprint/archetypes/CATALOGUE.yaml: []
  identity/README.md: []
  docs/IDENTITY-REPO-CONTRACT.md: []

# A line carrying one of these markers is exempt. The marker is a TAG, not an
# excuse: it must be followed by a reason on the same line, and the gate
# refuses a bare marker -- an unexplained exemption is the untagged-switch
# failure, where off-by-design and off-by-neglect look identical.
# Note both entries carry a trailing reason. That is not decoration: the gate
# treats these two lines as marker USES like any other, and a bare marker is
# itself a finding -- so the file that declares the markers must satisfy the
# rule it declares.
allowed_line_markers:
  - "exposure-gate: allow"    # declaring the marker here, not exempting a real hit
  - "exposure-fence: allow"   # declaring the marker here, not exempting a real hit

# Directories never walked. Build products, caches, and node-local runtime
# state -- none of which is part of what is published.
skip_dirs:
  - ".git"
  - ".github/ISSUE_TEMPLATE"
  - ".intentops"
  - ".pytest_cache"
  - ".ruff_cache"
  - ".venv"
  - "__pycache__"
  - "build"
  - "dist"
  - "node_modules"
  - "site-packages"

# Extensions never read as text. The gate also probes for a null byte, so an
# unlisted binary is still skipped -- this list only saves the read.
skip_extensions:
  - ".gz"
  - ".ico"
  - ".jpeg"
  - ".jpg"
  - ".pdf"
  - ".png"
  - ".pyc"
  - ".sig"
  - ".tar"
  - ".wasm"
  - ".webm"
  - ".whl"
  - ".woff"
  - ".woff2"
  - ".zip"

# Files larger than this are reported as UNSCANNED and counted in the
# denominator -- never skipped silently. A refusal stays in the population.
max_file_bytes: 4000000
