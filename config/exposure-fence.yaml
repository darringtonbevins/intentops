# Shapes, not names. These need no hashing -- a regex for an address is not an
# address. Each names the error it trades against (SIG-1 clause 7: a detector
# states its operating point).
patterns:
  - id: email-shaped
    regex: "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}"
    catches: "a real correspondent, wherever an example was meant"
    trades: "flags a genuine example address unless its domain is reserved below"
  - id: guid-shaped
    regex: "\\b[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}\\b"
    catches: "a tenant, subscription, or application identifier carried over from the estate"
    trades: "flags a deliberately illustrative identifier; use a marker for those"
  - id: record-key-shaped
    regex: "\\b[0-9]{4,6}-[0-9]{3,6}\\b"
    catches: "a composite record key of the private estate's shape, which resolves to a party"
    trades: "flags some version ranges and numeric spans; markers clear those"
  - id: private-key-block
    regex: "-----BEGIN [A-Z ]*PRIVATE KEY-----"
    catches: "key material pasted into the tree"
    trades: "nothing -- there is no legitimate reason for this string to exist here"

# Reserved-for-documentation domains (RFC 2606 / RFC 6761). An address at one
# of these is an example by definition and never a correspondent.
allowed_email_domains:
  - example.com
  - example.org
  - example.net
  - example.edu
  - localhost
  - invalid

# The files that carry the first-instance node's own words or its attribution,
# where a name is the point rather than a leak: the imprint is a first-person
# text; the archetype catalogue reserves that first instance's entry by name;
# the imprint manifest names the author whose counter-signature it defines; the
# identity-repo README states which node was the first conformant instance; and
# the identity-repo contract is the shape that instance satisfies.
#
# Corrected 2026-09-06: this list read three entries and named the CONTRACT as
# the file identifying the first instance. It does not -- it says only "exists
# privately". The sentence that names the instance lives in identity/README.md,
# and the author attribution lives in the imprint manifest, so the config and
# the tree disagreed. They now agree. The contract stays listed: it is the same
# class of file and a later edit may legitimately name the instance there.
#
# Added 2026-09-06 (same day): NOTICE and PROVENANCE.md, the repository's own
# copyright and provenance notices. A copyright line naming the repository
# owner is not a leak from the private estate -- it is the same public
# authorship `git log` and GitHub already disclose (the same reasoning behind
# `history_allowed_identities`, below), and a public repository with no
# readable copyright holder is worse than one with an exemption stated here.
allowed_paths:
  - genesis/imprint/IMPRINT.md
  - genesis/imprint/IMPRINT-MANIFEST.yaml
  - genesis/imprint/archetypes/CATALOGUE.yaml
  - identity/README.md
  - docs/IDENTITY-REPO-CONTRACT.md
  - NOTICE
  - PROVENANCE.md
  - LICENSE
  - README.md
  - release/v0.1.0-commit.txt

# WHICH tokens each allowed path may carry.
#
# This is deliberately not "allowed_paths are exempt from the whole denylist".
# A whole-file exemption puts a blind spot over the most sensitive prose in the
# repository, and it would look exactly like a clean scan: the gate would go
# green because it stopped looking, not because there was nothing to find. That
# is the failure mode of an untagged switch, where off-by-design and
# off-by-neglect are indistinguishable from outside.
#
# The first five paths carry the first instance's OWN name, which is not on
# the denylist above and therefore needs no exemption -- their lists stay
# empty, and the gate scans them like any other file.
#
# NOTICE and PROVENANCE.md are different: they carry the repository owner's
# display name as the stated copyright holder, and that name IS on the
# denylist (operator-given, operator-family), because it is also the private
# estate's operator identity. Added 2026-09-06: exactly 2 files, 2 token ids
# each -- 4 token-checks removed from the population, and ONLY those two ids;
# every other declared token, and every shape pattern, is still checked in
# both files (a GUID, a record key, or a stray private key in either would
# still be a hard finding).
#
# An empty list means NO token is exempt for that path. There is no value that
# means "all" -- if one existed, someone would eventually reach for it.
# A path here that is not in `allowed_paths`, or a token id that is not in
# `tokens`, is a HALT rather than a shrug.
allowed_path_tokens:
  genesis/imprint/IMPRINT.md: []
  genesis/imprint/IMPRINT-MANIFEST.yaml: []
  genesis/imprint/archetypes/CATALOGUE.yaml: []
  identity/README.md: []
  docs/IDENTITY-REPO-CONTRACT.md: []
  NOTICE: [operator-given, operator-family]
  PROVENANCE.md: [operator-given, operator-family]
  LICENSE: [operator-given, operator-family]
  README.md: [operator-given, operator-family]
  release/v0.1.0-commit.txt: [operator-given, operator-family]

# History-scope identity allowlist. Everything above governs the WORKING
# TREE; this block governs `--history` alone (scan_history never inherits it
# the other way, and never inherits `allowed_path_tokens` either -- a commit
# identity is not a file path).
#
# WHY THIS EXISTS: in a PUBLISHED repository the account that pushes it is
# not a leak. Its display name and a noreply address issued for exactly this
# purpose are the repository's own public authorship -- information `git log`
# already discloses to anyone who clones it -- not private-estate data
# arriving by accident. Without this block the history scan cannot tell that
# ordinary, expected authorship apart from an actual exposure, and every
# future commit reads red for a reason nobody has to fix.
#
# `identities` matches by KIND, each entry a digest of one string, never a
# whole-line pairing:
#   kind: name  -- the digest is of a lowercased display name. A match
#     exempts ONLY the token ids listed in `exempts`, and ONLY on the
#     specific author or committer line that name appears on -- never on the
#     subject or body, where the same word is still a finding.
#   kind: email -- the digest is of one lowercased address, exact. A match
#     exempts the email-shaped pattern for that address wherever it appears
#     in the commit (identity line, subject, or body).
# `allowed_email_domains` is broader and address-agnostic: any address at
# these domains clears the email-shaped pattern, anywhere in the commit. This
# is deliberately wider than the exact digests above -- stated as a trade,
# not an oversight -- because a noreply domain names the ISSUER, and the
# issuer already prevents the address from resolving to anyone.
#
# THIS IS AN EXEMPTION, NOT A REPAIR, same as every other exemption in this
# file. Per the rule stated at the top: before widening this block, state in
# the commit how many identities and how many checks it removes from the
# population. Today it exempts exactly one name (2 tokens: operator-given,
# operator-family) and two addresses (plus their domains) -- nothing else in
# a commit identity or message is exempt, and a personal or firm address
# landing in either is still a hard finding.
history_allowed_identities:
  identities:
    - id: repo-owner-display-name
      # class: repository owner display name -- the account whose commits
      # publish this repository.
      kind: name
      sha256: "c810644142402cca57c84f9fdf1e3ec5d3a2416766146d2a2db3c4b72c5ddcd0"
      exempts: [operator-given, operator-family]
    - id: repo-owner-github-noreply
      # class: GitHub noreply address -- issued by GitHub to the publishing
      # account so a real address never has to appear in a commit.
      kind: email
      sha256: "c779ed9279832543efa1994707942908fd245bac25d4c4d966365d697de642df"
    - id: coauthor-noreply
      # class: co-author noreply address -- the attribution trailer this
      # project's own commit convention appends when an assistant authors or
      # co-authors a commit.
      kind: email
      sha256: "cd29c5ac348a026a3ec5286890908fffb5bf6ab77f20672171be323a70c95026"
  allowed_email_domains:
    - users.noreply.github.com  # class: GitHub noreply address, any username
    - anthropic.com             # class: co-author noreply address

# A line carrying one of these markers is exempt. The marker is a TAG, not an
# excuse: it must be followed by a reason on the same line, and the gate
# refuses a bare marker -- an unexplained exemption is the untagged-switch
# failure, where off-by-design and off-by-neglect look identical.
# Note both entries carry a trailing reason. That is not decoration: the gate
# treats these two lines as marker USES like any other, and a bare marker is
# itself a finding -- so the file that declares the markers must satisfy the
# rule it declares.
allowed_line_markers:
  - "exposure-gate: allow"    # declaring the marker here, not exempting a real hit
  - "exposure-fence: allow"   # declaring the marker here, not exempting a real hit

# Directories never walked. Build products, caches, and node-local runtime
# state -- none of which is part of what is published.
skip_dirs:
  - ".git"
  - ".github/ISSUE_TEMPLATE"
  - ".intentops"
  - ".pytest_cache"
  - ".ruff_cache"
  - ".venv"
  - "__pycache__"
  - "build"
  - "dist"
  - "node_modules"
  - "site-packages"

# Extensions never read as text. The gate also probes for a null byte, so an
# unlisted binary is still skipped -- this list only saves the read.
skip_extensions:
  - ".gz"
  - ".ico"
  - ".jpeg"
  - ".jpg"
  - ".pdf"
  - ".png"
  - ".pyc"
  - ".sig"
  - ".tar"
  - ".wasm"
  - ".webm"
  - ".whl"
  - ".woff"
  - ".woff2"
  - ".zip"

# Files larger than this are reported as UNSCANNED and counted in the
# denominator -- never skipped silently. A refusal stays in the population.
max_file_bytes: 4000000
